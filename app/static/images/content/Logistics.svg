<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="logGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#1F81C2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#logGrad)"/>
  <!-- Abstract fleet / supply chain lines -->
  <g opacity="0.3" stroke="#93C5FD" stroke-width="1.5">
    <line x1="50" y1="350" x2="250" y2="180"/>
    <line x1="250" y1="180" x2="420" y2="240"/>
    <line x1="420" y1="240" x2="550" y2="120"/>
    <circle cx="50" cy="350" r="5" fill="#69B531"/>
    <circle cx="250" cy="180" r="7" fill="#69B531"/>
    <circle cx="420" cy="240" r="6" fill="#69B531"/>
    <circle cx="550" cy="120" r="8" fill="#69B531"/>
  </g>
  <!-- Cargo Container / Fleet icon abstract -->
  <g transform="translate(230, 110)">
    <rect x="0" y="20" width="140" height="90" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#93C5FD" stroke-width="2"/>
    <line x1="35" y1="20" x2="35" y2="110" stroke="#93C5FD" stroke-width="1.5"/>
    <line x1="70" y1="20" x2="70" y2="110" stroke="#93C5FD" stroke-width="1.5"/>
    <line x1="105" y1="20" x2="105" y2="110" stroke="#93C5FD" stroke-width="1.5"/>
    <circle cx="35" cy="130" r="14" fill="#69B531"/>
    <circle cx="105" cy="130" r="14" fill="#69B531"/>
  </g>
  <text x="300" y="280" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Logistics &amp; Supply Chain</text>
  <text x="300" y="310" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#93C5FD" text-anchor="middle">Enterprise Fleet &amp; Distribution Operations</text>
</svg>
